[package]
name = "tpt-armature-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layer 3 presentation: hex / assembly / graph views (egui)."
readme = "README.md"
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "gui",
    "egui",
    "hex-editor",
    "disassembly",
]
categories = [
    "gui",
    "development-tools",
    "command-line-utilities",
]

[dependencies]
tpt-armature-formats = { path = "../tpt-armature-formats" }
tpt-armature-ir = { path = "../tpt-armature-ir" }
tpt-armature-analysis = { path = "../tpt-armature-analysis" }
tpt-armature-ext = { path = "../tpt-armature-ext", optional = true }
egui = { version = "0.29", optional = true }
eframe = { version = "0.29", optional = true }

[features]
default = []
# The native/desktop application. (The production target is tpt-appfront, which
# is itself built on egui; this crate uses egui directly so it builds standalone.)
app = ["dep:egui", "dep:eframe"]
# The in-app Rhai script console / runner. Builds on `app` and the embedded
# scripting host from `tpt-armature-ext`.
scripts = ["app", "dep:tpt-armature-ext", "tpt-armature-ext/rhai"]

# eframe's web (wasm32) backend pulls in `getrandom`, which on wasm32-unknown-unknown
# requires its `wasm_js` cfg to be enabled. This only affects the wasm32 target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[[bin]]
name = "tpt-armature-gui"
path = "src/main.rs"
