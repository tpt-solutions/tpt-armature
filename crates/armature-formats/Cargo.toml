[package]
name = "armature-formats"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layer 1 ingestion: parse PE/ELF/Mach-O into a standardized MemoryMap."

[dependencies]
goblin.workspace = true
thiserror.workspace = true
pdb = { version = "0.8", optional = true }

[features]
default = []
# Mirror of `armature-disasm`'s `arm` feature. Enables ARM/AArch64 awareness
# (notably `Architecture::is_disassemblable`) without pulling in the disassembly
# backend. `armature-disasm/arm` enables this feature transitively.
arm = []
# Debug-information import: ELF `.symtab` recovery (always active under this
# feature) and PDB public-symbol parsing for PE (via the `pdb` crate).
debuginfo = ["dep:pdb"]

[dev-dependencies]
anyhow.workspace = true
