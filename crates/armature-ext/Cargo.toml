[package]
name = "armature-ext"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layer 4 extension: Rhai scripting and wasmtime sandboxed plugins."

[dependencies]
armature-formats = { path = "../armature-formats" }
armature-ir = { path = "../armature-ir" }
armature-analysis = { path = "../armature-analysis" }
thiserror.workspace = true
rhai = { version = "1", optional = true }
wasmtime = { version = "47", optional = true }

[features]
default = []
# Lightweight, natively-integrated scripting.
rhai = ["dep:rhai"]
# Sandboxed WebAssembly plugin host.
wasm = ["dep:wasmtime"]
