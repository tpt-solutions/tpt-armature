[package]
name = "tpt-armature-analysis"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layer 2 analysis: control-flow graph, data-flow, and cross-reference indexing."
readme = "README.md"
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "control-flow-graph",
    "data-flow",
    "cross-reference",
    "decompiler",
]
categories = [
    "development-tools",
]

[dependencies]
tpt-armature-ir = { path = "../tpt-armature-ir" }
tpt-armature-formats = { path = "../tpt-armature-formats" }
tpt-armature-disasm = { path = "../tpt-armature-disasm" }
thiserror.workspace = true
serde_json = "1"
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
trybuild = "1"

[features]
# MMIO/register-access mining pass (see crates/tpt-armature-analysis/src/mmio.rs).
# Off by default to keep the workspace build light per CLAUDE.md.
mmio = []
# Register-table / function similarity diffing (crates/.../src/regdiff.rs).
# Builds on the `mmio` RegisterTable type, so it implies `mmio`.
regdiff = ["mmio"]
# Windows kernel-driver (.sys) profile recovery. Depends on the formats crate's
# `driver-pe` feature for `DriverInfo` / `CtlCode`.
driver-pe = ["tpt-armature-formats/driver-pe"]
# Clean-room analyst mode: structurally enforced export of only review-safe
# artifacts (RegisterTable / DriverProfile). Implies both source features and the
# SHA-256 dependency used for the audit trail.
clean-room = ["mmio", "driver-pe", "sha2"]
