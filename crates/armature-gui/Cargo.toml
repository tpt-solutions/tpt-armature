[package]
name = "armature-gui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layer 3 presentation: hex / assembly / graph views (egui)."

[dependencies]
armature-formats = { path = "../armature-formats" }
armature-ir = { path = "../armature-ir" }
armature-analysis = { path = "../armature-analysis" }
egui = { version = "0.29", optional = true }
eframe = { version = "0.29", optional = true }

[features]
default = []
# The native/desktop application. (The production target is tpt-appfront, which
# is itself built on egui; this crate uses egui directly so it builds standalone.)
app = ["dep:egui", "dep:eframe"]

[[bin]]
name = "armature-gui"
path = "src/main.rs"
