[package]
name = "tpt-armature-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "TPT Armature command-line driver (headless analysis pipeline)."
readme = "README.md"
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "cli",
    "disassembly",
    "decompiler",
    "forensics",
]
categories = [
    "command-line-utilities",
    "development-tools",
]

[[bin]]
name = "tpt-armature"
path = "src/main.rs"

[dependencies]
tpt-armature-formats = { path = "../tpt-armature-formats" }
tpt-armature-ir = { path = "../tpt-armature-ir" }
tpt-armature-disasm = { path = "../tpt-armature-disasm" }
tpt-armature-analysis = { path = "../tpt-armature-analysis" }
tpt-armature-ext = { path = "../tpt-armature-ext", optional = true }
clap.workspace = true
anyhow.workspace = true
tiny_http = { version = "0.12", optional = true }

[features]
default = []
# Enable the `script` subcommand (Rhai automation).
rhai = ["dep:tpt-armature-ext", "tpt-armature-ext/rhai"]
# Enable the `plugin` subcommand (sandboxed Wasm plugins).
wasm = ["dep:tpt-armature-ext", "tpt-armature-ext/wasm"]
# Forward to the disassembly backend's ARM/AArch64 support (for `--all-features`
# builds and parity with the documented feature matrix).
arm = ["tpt-armature-disasm/arm"]
# Debug-information import: ELF `.symtab` (always on with this feature) and PDB
# public-symbol merging for PE via the `analyze --pdb` option.
debuginfo = ["tpt-armature-formats/debuginfo"]
# Headless web UI: serve the analysis of a binary over HTTP.
serve = ["dep:tiny_http"]
