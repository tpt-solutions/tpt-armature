[package]
name = "armature-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "TPT Armature command-line driver (headless analysis pipeline)."

[[bin]]
name = "armature"
path = "src/main.rs"

[dependencies]
armature-formats = { path = "../armature-formats" }
armature-ir = { path = "../armature-ir" }
armature-disasm = { path = "../armature-disasm" }
armature-analysis = { path = "../armature-analysis" }
armature-ext = { path = "../armature-ext", optional = true }
clap.workspace = true
anyhow.workspace = true

[features]
default = []
# Enable the `script` subcommand (Rhai automation).
rhai = ["dep:armature-ext", "armature-ext/rhai"]
# Enable the `plugin` subcommand (sandboxed Wasm plugins).
wasm = ["dep:armature-ext", "armature-ext/wasm"]
# Forward to the disassembly backend's ARM/AArch64 support (for `--all-features`
# builds and parity with the documented feature matrix).
arm = ["armature-disasm/arm"]
# Debug-information import: ELF `.symtab` (always on with this feature) and PDB
# public-symbol merging for PE via the `analyze --pdb` option.
debuginfo = ["armature-formats/debuginfo"]
