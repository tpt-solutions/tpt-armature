[package]
name = "armature-disasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layer 2 disassembly backends (iced-x86/x64, yaxpeax ARM) lowered into armature-ir."

[dependencies]
armature-ir = { path = "../armature-ir" }
armature-formats = { path = "../armature-formats" }
iced-x86 = "1.21"
thiserror.workspace = true
yaxpeax-arch = { version = "0.3", optional = true }
yaxpeax-arm = { version = "0.4", optional = true }

[features]
default = []
arm = ["dep:yaxpeax-arch", "dep:yaxpeax-arm", "armature-formats/arm"]
