[package]
name = "tpt-armature-formats"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Layer 1 ingestion: parse PE/ELF/Mach-O into a standardized MemoryMap."
readme = "README.md"
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "binary-parsing",
    "pe",
    "elf",
    "mach-o",
    "memory-map",
]
categories = [
    "parser-implementations",
    "development-tools",
    "filesystem",
]

[dependencies]
goblin.workspace = true
thiserror.workspace = true
pdb = { version = "0.8", optional = true }
gimli = { version = "0.31", optional = true, default-features = false, features = ["read", "std"] }

[features]
default = []
# Mirror of `tpt-armature-disasm`'s `arm` feature. Enables ARM/AArch64 awareness
# (notably `Architecture::is_disassemblable`) without pulling in the disassembly
# backend. `tpt-armature-disasm/arm` enables this feature transitively.
arm = []
# Debug-information import: ELF `.symtab` recovery (always active under this
# feature), PDB public-symbol parsing for PE (via the `pdb` crate), and DWARF
# subprogram names/addresses from ELF (via the `gimli` crate).
debuginfo = ["dep:pdb", "dep:gimli"]

[dev-dependencies]
anyhow.workspace = true
