# cargo-audit configuration.
# cargo-audit 0.22 reads this from `.cargo/audit.toml` (or `~/.cargo/audit.toml`).
# Mirrors the security posture of sibling tpt-* repositories.

[advisories]
# Advisories that are tracked but intentionally not blocking. Each entry is a
# transitive dependency we do not control directly and whose vulnerable code
# path is never exercised by TPT Armature.
ignore = [
    # quick-xml 0.30.0 — pulled transitively by egui 0.29 -> accesskit -> zbus
    # (Linux-only AT-SPI accessibility bridge). TPT Armature never parses XML or
    # speaks D-Bus; the vulnerable attribute-parsing / namespace-allocation code
    # is unreachable on every supported platform. Bumping requires upgrading egui
    # (currently pinned to 0.29 per spec.txt), tracked separately.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # Unmaintained transitive dependencies inherited from the egui/wgpu/accesskit
    # GUI stack. They carry no security advisory, only an "unmaintained" notice,
    # and none of their APIs are on a hot path we can replace without forking egui.
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0249", # smartstring
    "RUSTSEC-2026-0192", # ttf-parser
]
